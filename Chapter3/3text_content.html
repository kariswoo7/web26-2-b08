    <h1>홍차</h1>
    <hr><!--구분선-->

    <h2>정의</h2>
    <p>홍차는 중국에서 생산되는 차로, <br>주로 녹차와 흑차로 나뉜다.</p>

    <br><!--줄바꿈-->
    <h2>등급</h2>
    <p>홍차는 일반적으로 1등급부터 5등급까지 나뉘며, 등급은 품질과 맛에 따라 결정된다.</p>
    <P> -브로큰 페코</P>
    <P> -브로큰 페코 수숑</P>
    <P> -브로큰 오렌지 페코</P>

    <hr>
    <h1>4.특수 문자 표기</h1>
    <h2>공백이 있는 글자</h2>
    <h3>공백이   있는   글자</h3>
    <h3>공백이&nbsp;&nbsp;&nbsp;있는&nbsp;&nbsp;&nbsp;글자</h3>

    <h2>특수 문자 표기</h2>
    <h3>ex. (숫자1) < (숫자2) 표시할 때.. </h3>
    <h3>5 < 9 </h3>
    <h3>5 &lt; 9 </h3>

    <h3>3 > 2 </h3>
    <h3>3 &gt; 2 </h3>

    <h3>ex. (숫자1) & (숫자2) 표시할 때.. </h3>
    <h3>(숫자1) &amp; (숫자2)</h3>
